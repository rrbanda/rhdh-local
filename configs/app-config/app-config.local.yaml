# --------- Knowledge Base Configuration ---------
# Using Llama Stack (OpenAI-compatible RAG with built-in vector store)
# Llama Stack handles embeddings and vector storage automatically
#
knowledgeBase:
  llamastack:
    baseUrl: 'https://lss-lss.apps.cluster-nngf2.dynamic.redhatworkshops.io'
    vectorStoreId: 'vs_c937db92-71d9-43da-885c-113c112d9c55'
    model: 'gemini/gemini-2.5-flash'
    chunkingStrategy: 'static'
    maxChunkSizeTokens: 200
    chunkOverlapTokens: 50
#
# Alternative: Traditional embedding provider + vector store (Pinecone/ChromaDB)
# Comment out llamastack above and uncomment below to use:
#
# knowledgeBase:
#   embeddingProviders:
#     - id: gemini
#       token: ${GEMINI_API_KEY}
#       model: gemini-embedding-001
#       dimensions: 3072
#   vectorStores:
#     - id: pinecone
#       apiKey: ${PINECONE_API_KEY}
#       indexName: k8s-knowledge-base
# ------------------------------------------------

proxy:

techdocs:
  builder: 'local'
  generator:
    runIn: 'docker'
  publisher:
    type: 'local'

auth:
  providers:
    guest: {}

scaffolder:

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Local examples with Kubernetes annotations
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

# --------- Kubernetes/OpenShift Configuration ---------
# Required for "Select Pod" dropdown and K8s resource discovery
# Set OPENSHIFT_TOKEN via: export OPENSHIFT_TOKEN=$(oc whoami -t)
kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - name: openshift-nngf2
          url: https://api.cluster-nngf2.dynamic.redhatworkshops.io:6443
          authProvider: 'serviceAccount'
          serviceAccountToken: ${OPENSHIFT_TOKEN}
          skipTLSVerify: true
# ------------------------------------------------

permission:
  enabled: false
